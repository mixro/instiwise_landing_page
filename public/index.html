<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/android-chrome-192x192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Essential SEO Meta Tags -->
  <title>InstiWise | Seamless Scheduling</title>
  <meta name="description" content="InstiWise is an intelligent institute management and collaboration platform designed to enhance academic connectivity, communication, and productivity. Access real-time schedules, share projects, receive announcements, and build meaningful student networks on campus.">
  <meta name="keywords" content="institute management platform, campus collaboration, academic scheduling, project sharing, student networking, educational app, smart campus">
  <meta name="robots" content="index, follow">
  <meta name="author" content="InstiWise Team">

  <meta name="google-site-verification" content="OuWi2jgPlmXFjqTlzEEq3V56u3C-yZGFyOGU1LAn33M" />
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://instiwise-app.netlify.app/">
  
  <!-- Open Graph / Social Media Tags (for rich previews on Facebook, LinkedIn, WhatsApp, etc.) -->
  <meta property="og:title" content="InstiWise - The Smart Way to Connect Your Campus">
  <meta property="og:description" content="Real-time academic schedules, project showcase, announcements, and smart networking for students, faculty, and staff.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://instiwise-app.netlify.app/">
  <meta property="og:image" content="https://instiwise-app.netlify.app/assets/og-image.png"> <!-- Replace with your actual OG image -->
  <meta property="og:site_name" content="InstiWise">
  <meta property="og:locale" content="en_US">
  
  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="InstiWise - The Smart Way to Connect Your Campus">
  <meta name="twitter:description" content="Intelligent platform for institute management, real-time schedules, project sharing, and campus networking.">
  <meta name="twitter:image" content="https://instiwise-app.netlify.app/assets/og-image.png">
  <meta name="twitter:site" content="@instiwise"> <!-- Replace with your Twitter handle if available -->
  
  <!-- Structured Data (JSON-LD) for Educational Platform -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "InstiWise",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Android, iOS",
    "description": "InstiWise is an intelligent institute management and collaboration platform that brings students, faculty, and staff together with real-time schedules, project sharing, announcements, and meaningful academic networking.",
    "url": "https://instiwise-app.netlify.app/",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.9",
      "reviewCount": "200"
    }
  }
  </script>
  
  <!-- Additional WebApplication Schema (for progressive web app feel) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "InstiWise",
    "url": "https://instiwise-app.netlify.app/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://instiwise-app.netlify.app/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  
  <!-- Preconnect for faster loading (optional but good for performance SEO) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
